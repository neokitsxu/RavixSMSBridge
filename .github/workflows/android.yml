name: Build RavixSMSBridge APK

on:
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'

  - name: Install SDK Packages
    run: |
      sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Source
    run: |
      unzip RavixSMSBridge-Android-Source.zip -d source
      find source -name settings.gradle -o -name settings.gradle.kts

  - name: Build APK
    run: |
      PROJECT_DIR=$(find source -type f -name settings.gradle -o -name settings.gradle.kts -printf '%h\n' | head -n 1)
      test -n "$PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RavixSMSBridge-APK
      path: source/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
