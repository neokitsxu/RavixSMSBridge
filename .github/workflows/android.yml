name: Build RavixSMSBridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RavixSMSBridge-Android-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Source
        run: |
          unzip RavixSMSBridge-Android-Source.zip -d source

      - name: Build APK
        working-directory: source/RavixSMSBridge
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RavixSMSBridge-APK
          path: source/RavixSMSBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
